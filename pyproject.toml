[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "fnal-ecl-client"
version = "0.1.0"
description = "C, C++, command-line, and Python client for the Fermilab Electronic Logbook"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Andrew Norman" }]
keywords = ["fermilab", "ecl", "logbook"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: C",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/normanajn/ecl-client"
Source = "https://github.com/normanajn/ecl-client"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["python/ecl_client"]

[tool.scikit-build.cmake.define]
ECL_BUILD_PYTHON = "ON"
ECL_BUILD_CLI = "OFF"
ECL_BUILD_TESTS = "OFF"
